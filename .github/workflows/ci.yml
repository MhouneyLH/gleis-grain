name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      features: ${{ steps.matrix.outputs.features }}
      common: ${{ steps.filter.outputs.shared }}
      apphost: ${{ steps.filter.outputs.apphost }}
      modules: ${{ steps.filter.outputs.modules }}
      simulator: ${{ steps.filter.outputs.simulator }}
      postgres: ${{ steps.filter.outputs.postgres }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            shared:
              - 'src/Common*/**'
              - 'test/Common*/**'
              - 'test/Directory.Build.props'
              - 'src/Features/Directory.Build.props'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'global.json'
              - 'nuget.config'
              - '.editorconfig'
              - '.github/workflows/**'
            apphost:
              - 'src/AppHost/**'
              - 'src/Host/**'
            modules:
              - 'src/Host/**'
              - 'test/Modules/**'
            Stops:
              - 'src/Features/Stops/**'
              - 'test/Features/Stops/**'
            Trips:
              - 'src/Features/Trips/**'
              - 'test/Features/Trips/**'
            Alerts:
              - 'src/Features/Alerts/**'
              - 'test/Features/Alerts/**'
            Ingestion:
              - 'src/Features/Ingestion/**'
              - 'test/Features/Ingestion/**'
            Game:
              - 'src/Features/Game/**'
              - 'test/Features/Game/**'
            Cluster:
              - 'src/Features/Cluster/**'
              - 'test/Features/Cluster/**'
            simulator:
              - 'src/Simulator/**'
              - 'test/Simulator/**'
            postgres:
              - 'db/**'
              - 'src/Host/**'
              - 'test/Infrastructure/**'
            frontend:
              - 'src/Frontend/**'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - '.github/workflows/**'
      - name: Build feature matrix
        id: matrix
        env:
          SHARED: ${{ steps.filter.outputs.shared }}
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          all='["Stops","Trips","Alerts","Ingestion","Game","Cluster"]'
          if [ "$SHARED" = "true" ]; then
            features="$all"
          else
            features=$(jq -c --argjson all "$all" '[.[] | select(. as $f | $all | index($f))]' <<<"$CHANGED")
          fi
          echo "features=$features" >> "$GITHUB_OUTPUT"

  feature:
    needs: changes
    if: needs.changes.outputs.features != '[]'
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJson(needs.changes.outputs.features) }}
    uses: ./.github/workflows/_feature.yml
    with:
      feature: ${{ matrix.feature }}

  apphost:
    needs: changes
    if: needs.changes.outputs.apphost == 'true' || needs.changes.outputs.common == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet build src/AppHost/GleisGrain.AppHost.csproj --configuration Release

  # Module boundaries and the composition of all modules into one silo.
  modules:
    needs: changes
    if: needs.changes.outputs.features != '[]' || needs.changes.outputs.common == 'true' || needs.changes.outputs.apphost == 'true' || needs.changes.outputs.modules == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet test --project test/Modules/GleisGrain.Modules.Tests/GleisGrain.Modules.Tests.csproj --configuration Release

  # The audience simulator talks to the public API only, so it has no module dependency.
  simulator:
    needs: changes
    if: needs.changes.outputs.simulator == 'true' || needs.changes.outputs.common == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet test --project test/Simulator/GleisGrain.Simulator.Tests/GleisGrain.Simulator.Tests.csproj --configuration Release

  # Orleans against a real Postgres (Testcontainers): the SQL scripts in db/, clustering, grain storage, reminders.
  # The runners have Docker. Without Docker the tests would skip, so a green run here means they really ran.
  postgres:
    needs: changes
    if: needs.changes.outputs.postgres == 'true' || needs.changes.outputs.common == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet test --project test/Infrastructure/GleisGrain.Postgres.Tests/GleisGrain.Postgres.Tests.csproj --configuration Release

  # The Vue app in src/Frontend. Only runs when it, the build props or the workflows changed.
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/Frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm test
      - run: npm run build

  # Single required check for branch protection; skipped jobs count as success.
  ci-ok:
    if: always()
    needs: [changes, feature, apphost, modules, simulator, postgres, frontend]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if any job failed or was cancelled
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then exit 1; fi
